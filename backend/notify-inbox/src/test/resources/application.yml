spring:
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: inbox
  datasource:
    url: jdbc:h2:mem:inbox_test;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS inbox
    username: sa
    password:
    driver-class-name: org.h2.Driver
