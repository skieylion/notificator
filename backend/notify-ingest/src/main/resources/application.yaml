server:
  port: 8080

spring:
  application:
    name: notify-ingest

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: Notification Ingest API
    version: 1.0.0
    description: API для приёма запросов на отправку уведомлений

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  notify:
    topic: notify.p0
