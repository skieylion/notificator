services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notificator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notificator"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  notify-inbox:
    build:
      context: ./backend
      dockerfile: notify-inbox/Dockerfile
    ports:
      - "8082:8082"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: notificator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  notification-router:
    build:
      context: ./backend
      dockerfile: notification-router/Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  integration-tests:
    build:
      context: ./backend
      dockerfile: integration-tests/Dockerfile
    depends_on:
      notification-router:
        condition: service_healthy
